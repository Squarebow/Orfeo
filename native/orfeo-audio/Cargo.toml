[package]
name = "orfeo-audio"
version = "0.1.0"
edition = "2021"
description = "Orfeo's native audio engine: FluidSynth + sample-accurate song player + live MIDI; WASAPI exclusive/shared output on Windows"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "orfeo-engine"
path = "src/bin/orfeo-engine.rs"

[[bin]]
name = "orfeo-selftest"
path = "src/bin/orfeo-selftest.rs"

[dependencies]
libloading = "0.9"
midir = "0.11"
midly = "0.5"
rtrb = "0.4"

[features]
# Development only: the CPAL driver (macOS/Linux) on Windows too, instead of WASAPI
cpal-driver = ["dep:cpal"]

# The sound-card drivers. Windows: WASAPI (wasapi_driver.rs, output.rs).
# macOS/Linux: CPAL (cpal_driver.rs). On Linux: the PulseAudio protocol directly when
# a sound server runs (PulseAudio, or PipeWire through pipewire-pulse — pure Rust, no
# libpulse), ALSA otherwise; rtkit real-time priority.
[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["realtime-dbus", "pulseaudio"] }

[target.'cfg(windows)'.dependencies]
cpal = { version = "0.18", optional = true }
wasapi = "0.26"
windows = { version = "0.62", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_System_Com", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints"] }
