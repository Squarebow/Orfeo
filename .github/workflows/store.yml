# Sends a released version to the Microsoft Store.
#
# Run it by hand once the GitHub release is out: GitHub → Actions →
# Microsoft Store → Run workflow, type the version (e.g. 1.5.1). It finds the
# Store package that version's Release run built (its "store-package"
# artifact), starts a Store update from the published one and, with
# "submit", sends it for certification; "draft" leaves it in Partner Center
# for you to check and submit. Talks to Partner Center through
# scripts/store-submit.mjs. One-time setup: docs/CONTRIBUTING.md →
# "Microsoft Store".
name: Microsoft Store
run-name: Microsoft Store ${{ inputs.version }} (${{ inputs.mode }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to send, e.g. 1.5.1 (no v). Its Release run must have finished."
        required: true
      mode:
        description: "submit: send it for certification · draft: leave it in Partner Center for you to submit"
        type: choice
        options: [submit, draft]
        default: submit

permissions:
  actions: read
  contents: read

jobs:
  store:
    name: Send to the Microsoft Store
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Find the version's Store package
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          VERSION="${VERSION#v}"
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/v$VERSION" --jq .sha 2>/dev/null) || {
            echo "### Microsoft Store: not sent" >> "$GITHUB_STEP_SUMMARY"
            echo "There is no tag v$VERSION on GitHub. Type the version exactly as released, e.g. 1.5.1." >> "$GITHUB_STEP_SUMMARY"
            exit 1; }
          # The newest Release run of that version that kept a Store package.
          # A Release run is started on main but builds from the tag, so its
          # recorded commit is main's, not the tag's: runs of the tag's commit
          # first, then recent runs whose release notes name this version.
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?head_sha=$sha&per_page=20" --jq '.workflow_runs[].id')
          for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?status=success&per_page=30" --jq '.workflow_runs[].id'); do
            rm -rf notes
            gh run download "$run" -n release-notes -D notes 2>/dev/null || continue
            grep -qsE "Orfeo $VERSION( |$)" notes/* && runs="$runs $run"
          done
          for run in $runs; do
            if gh run download "$run" -n store-package -D store 2>/dev/null; then echo "Package from Release run $run"; break; fi
          done
          ls store/*.appx >/dev/null 2>&1 || {
            echo "### Microsoft Store: not sent" >> "$GITHUB_STEP_SUMMARY"
            echo "No Store package found for v$VERSION: its Release run hasn't built one (pre-release, or it failed before step 2), or it's older than 90 days." >> "$GITHUB_STEP_SUMMARY"
            exit 1; }

      - name: Send it
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          MS_STORE_PRODUCT_ID: ${{ vars.MS_STORE_PRODUCT_ID }}
        run: node scripts/store-submit.mjs "$(ls store/*.appx | head -1)" ${{ inputs.mode == 'draft' && '--draft' || '' }}
