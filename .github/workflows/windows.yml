# Builds the Windows installer and portable app, code-signed by SignPath, and keeps
# them as the run artifact "windows-release" (installer, its blockmap, portable app,
# latest.yml). Used two ways:
#   • by the Release workflow (release.yml → "2. Build (Windows)"), from the tag;
#     release.yml then uploads the files into the draft release;
#   • by hand, as a signing test that releases nothing:
#     Actions → Windows SignPath build → Run workflow.
#
# Signing, in two rounds because the installer packs the program files inside it:
#   1. the program files built from this repository (.signpath/app-files.xml)
#   2. the installer and portable app made from those (.signpath/installers.xml)
# Each round: upload the files as a run artifact → SignPath signs them → the signed
# copies come back. The signing policy is the repository variable
# SIGNPATH_SIGNING_POLICY: test-signing (self-signed test certificate, the default)
# until the real certificate is in SignPath, then release-signing. The API token of
# the SignPath CI user is the secret SIGNPATH_API_TOKEN. Setup: docs/CONTRIBUTING.md
# → "Windows code signing".
name: Windows SignPath build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Tag or branch to build"
        type: string
        required: true
      store:
        description: "Also build the Microsoft Store package (.appx)"
        type: boolean
        default: false
    secrets:
      SIGNPATH_API_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build + sign
    runs-on: windows-latest
    # signing can wait up to an hour per round for an approval in SignPath
    timeout-minutes: 180
    permissions:
      contents: read
      # SignPath downloads the files to sign from this run's artifacts
      actions: read
    steps:
      - name: Get the code (the release tag, or the branch picked for a test run)
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # The Native sound engine: Rust add-on + the pinned FluidSynth DLLs
      # (scripts/build-native.mjs). Rust and MSVC come with the Windows runner;
      # the cache keeps the Rust build to a couple of minutes.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Build the native audio engine
        run: npm run native:build

      - name: Build the app folder
        shell: bash
        run: |
          npm run build
          npx electron-builder --win --dir --publish never

      - name: Collect the program files to sign
        shell: bash
        run: |
          set -euo pipefail
          mkdir sign-app
          cp release/win-unpacked/Orfeo.exe \
             release/win-unpacked/resources/native/orfeo_audio.node \
             release/win-unpacked/resources/native/orfeo-review.exe sign-app/

      - name: Upload the program files for signing
        id: upload-app
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-app-files
          path: sign-app/*
          if-no-files-found: error

      - name: Sign the program files (SignPath)
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 28762cda-eb5e-44b5-b89a-3d6d4bd3f654
          project-slug: Orfeo
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'test-signing' }}
          artifact-configuration-slug: app-files
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion: true
          # release-signing waits for a person to approve the request in SignPath
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-app

      - name: Put the signed program files back into the app folder
        shell: bash
        run: |
          set -euo pipefail
          cp signed-app/Orfeo.exe release/win-unpacked/
          cp signed-app/orfeo_audio.node signed-app/orfeo-review.exe release/win-unpacked/resources/native/

      - name: Build the installer and portable app from the signed app folder
        shell: bash
        run: |
          npx electron-builder --win nsis portable --prepackaged release/win-unpacked --publish never \
            '-c.nsis.artifactName=Orfeo-Setup-${version}.${ext}' \
            '-c.portable.artifactName=Orfeo-${version}-portable.${ext}'

      - name: Collect the installer and portable app to sign
        shell: bash
        run: |
          set -euo pipefail
          v=$(node -p "require('./package.json').version")
          mkdir sign-installers
          cp "release/Orfeo-Setup-$v.exe" sign-installers/Orfeo-Setup.exe
          cp "release/Orfeo-$v-portable.exe" sign-installers/Orfeo-portable.exe

      - name: Upload the installer and portable app for signing
        id: upload-installers
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installers
          path: sign-installers/*
          if-no-files-found: error

      - name: Sign the installer and portable app (SignPath)
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 28762cda-eb5e-44b5-b89a-3d6d4bd3f654
          project-slug: Orfeo
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'test-signing' }}
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.upload-installers.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installers

      # Signing changes the installer's bytes, so the checksum and blockmap
      # electron-builder made are rebuilt from the signed file
      # (scripts/signed-update-info.mjs); otherwise installed copies would refuse
      # the update.
      - name: Put the signed files back and rebuild latest.yml
        shell: bash
        run: |
          set -euo pipefail
          v=$(node -p "require('./package.json').version")
          cp signed-installers/Orfeo-Setup.exe "release/Orfeo-Setup-$v.exe"
          cp signed-installers/Orfeo-portable.exe "release/Orfeo-$v-portable.exe"
          node scripts/signed-update-info.mjs "release/Orfeo-Setup-$v.exe"

      # Fails the release if any file came back unsigned. A test-certificate
      # signature isn't trusted by Windows, so this checks there is one, not that
      # Windows trusts it.
      - name: Check the signatures
        shell: pwsh
        run: |
          $v = node -p "require('./package.json').version"
          $files = @(
            "release/win-unpacked/Orfeo.exe",
            "release/win-unpacked/resources/native/orfeo_audio.node",
            "release/win-unpacked/resources/native/orfeo-review.exe",
            "release/Orfeo-Setup-$v.exe",
            "release/Orfeo-$v-portable.exe"
          )
          $bad = 0
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f
            "{0}: {1} — {2}" -f $f, $sig.Status, $sig.SignerCertificate.Subject
            if ($null -eq $sig.SignerCertificate) { $bad++ }
          }
          if ($bad) { Write-Error "$bad file(s) are not signed"; exit 1 }

      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: |
            release/Orfeo-Setup-*.exe
            release/Orfeo-Setup-*.exe.blockmap
            release/Orfeo-*-portable.exe
            release/latest.yml
          if-no-files-found: error

      # The Store package isn't signed here — the Store signs it — so it is no
      # use on the GitHub release page; the Microsoft Store workflow (store.yml) picks it up.
      # Built from the same (signed) app folder, so it's the same app.
      # A pre-release version (1.5.0-beta.1) can't be a Store version at all.
      - name: Build the Microsoft Store package
        if: ${{ inputs.store }}
        shell: bash
        run: npx electron-builder --win appx --prepackaged release/win-unpacked --publish never

      - uses: actions/upload-artifact@v7
        if: ${{ inputs.store }}
        with:
          name: store-package
          path: release/*.appx
          if-no-files-found: error

