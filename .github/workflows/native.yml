# The Native sound engine (Rust, native/): checks on every push to dev and every
# pull request that touches it.
#   • Windows: builds the add-on with its pinned FluidSynth (scripts/build-native.mjs)
#     and runs the engine's tests — including the one proving the live mix equals
#     the export mix (renderer.rs → live_mix_matches_the_export_mix).
#   • macOS and Linux: the engine and add-on must compile (CPAL driver), and the
#     engine's self-test (orfeo-selftest: timing, levels, mute, compressor, preview
#     notes, count-in, metronome, seek, tempo, Low latency ↔ normal, buffer
#     step-up) must pass playing a demo song into a virtual sound card —
#     PulseAudio's null sink on Linux (reached through ALSA, as desktop Linux
#     reaches PulseAudio/PipeWire), BlackHole on macOS — with the FluidSynth we
#     build and ship (scripts/build-native-unix.mjs), once with the bundled sound
#     set and once with a compressed .sf3. These are virtual machines: the self-test's --virtual reports
#     timing steadiness instead of failing on it; every musical check is strict.
# Read-only, no secrets.
name: Native engine

on:
  push:
    branches: [dev]
    paths: ["native/**", "scripts/build-native*.mjs", ".github/workflows/native.yml"]
  pull_request:
    paths: ["native/**", "scripts/build-native*.mjs", ".github/workflows/native.yml"]

permissions:
  contents: read

jobs:
  windows:
    name: Windows — build + tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      # the add-on + FluidSynth DLLs the tests load (native/build/); the script
      # needs only Node itself, no npm packages
      - name: Build the native engine
        run: node scripts/build-native.mjs

      # The synth start-up race (fluid.rs) only shows as the first FluidSynth use
      # in a process, so it runs alone, a few times, before the whole suite
      - name: Engine tests
        working-directory: native
        shell: bash
        run: |
          for i in 1 2 3 4 5; do cargo test --release -p orfeo-audio --lib concurrent_first_start; done
          cargo test --release -p orfeo-audio

  compile:
    name: ${{ matrix.os }} — compiles
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # midir/CPAL need ALSA's headers on Linux, rtkit real-time priority needs D-Bus's
      - name: ALSA and D-Bus headers
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev libdbus-1-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Build engine + add-on, compile the tests
        working-directory: native
        run: |
          cargo build --release -p orfeo-audio -p orfeo-audio-node
          cargo test --release -p orfeo-audio --no-run

  plays:
    name: ${{ matrix.os }} — plays (virtual sound card)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Virtual sound card (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libasound2-dev libdbus-1-dev alsa-utils pulseaudio pulseaudio-utils libasound2-plugins
          # ALSA's default device → PulseAudio → a null sink that plays in real time
          echo 'pcm.!default { type pulse }' | sudo tee /etc/asound.conf
          echo 'ctl.!default { type pulse }' | sudo tee -a /etc/asound.conf
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=virtual
          pactl set-default-sink virtual
          # Without this every new stream stalls ~2 s: an idle null sink works in blocks of
          # up to 2 s. A silent low-latency stream keeps them small, as with a real card
          # (measured: 100% of real time and no gaps, on both routes).
          nohup pacat --playback --raw --latency-msec=5 /dev/zero > /dev/null 2>&1 &
          sleep 1
          pactl list short sink-inputs
          pactl info | grep -i 'default sink'

      - name: Virtual sound card (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --cask blackhole-2ch
          sudo killall coreaudiod || true
          sleep 5
          system_profiler SPAudioDataType | head -30

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # FluidSynth and its codecs take a few minutes: rebuilt only when the script changes
      - uses: actions/cache@v6
        with:
          path: native/build/fluidsynth
          key: fluidsynth-${{ runner.os }}-${{ hashFiles('scripts/build-native-unix.mjs') }}

      - name: Build the add-on and FluidSynth, as the packages do
        run: node scripts/build-native.mjs

      - name: What was built
        run: |
          ls -la native/build native/build/fluidsynth
          if [ "$RUNNER_OS" = macOS ]; then
            lipo -info native/build/orfeo_audio.node native/build/fluidsynth/libfluidsynth.3.dylib
            otool -L native/build/fluidsynth/libfluidsynth.3.dylib
          else
            ldd native/build/fluidsynth/libfluidsynth.so.3
          fi

      - name: Self-test
        working-directory: native
        run: |
          cargo build --release -p orfeo-audio --bin orfeo-selftest
          ./target/release/orfeo-selftest --virtual --fluid build/fluidsynth --sf2 ../public/GeneralUser-GS.sf2 "../public/Demo/Vivaldi - Summer (Presto).mid"

      # a compressed sound set, the one Orfeo offers to download: needs libsndfile's codecs
      - name: Self-test with a compressed sound set (.sf3)
        if: ${{ !cancelled() }}
        working-directory: native
        run: |
          curl -sSL --fail -o "$RUNNER_TEMP/MuseScore_General.sf3" https://ftp.osuosl.org/pub/musescore/soundfont/MuseScore_General/MuseScore_General.sf3
          ./target/release/orfeo-selftest --virtual --fluid build/fluidsynth --sf2 "$RUNNER_TEMP/MuseScore_General.sf3" "../public/Demo/Vivaldi - Summer (Presto).mid"

      # ALSA is the route when no sound server runs (ALSA-only systems): same self-test
      - name: Self-test through ALSA
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        working-directory: native
        env:
          ORFEO_AUDIO_HOST: alsa
        run: ./target/release/orfeo-selftest --virtual --fluid build/fluidsynth --sf2 ../public/GeneralUser-GS.sf2 "../public/Demo/Vivaldi - Summer (Presto).mid"
