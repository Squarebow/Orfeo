# The Native sound engine (Rust, native/): checks on every push to dev and every
# pull request that touches it.
#   • Windows: builds the add-on with its pinned FluidSynth (scripts/build-native.mjs)
#     and runs the engine's tests — including the one proving the live mix equals
#     the export mix (renderer.rs → live_mix_matches_the_export_mix).
#   • macOS and Linux: the engine and add-on must compile (CPAL driver), and the
#     engine's self-test (orfeo-selftest: timing, levels, mute, compressor, preview
#     notes, count-in, metronome, seek, tempo, Low latency ↔ normal, buffer
#     step-up) must pass playing a demo song into a virtual sound card —
#     PulseAudio's null sink on Linux (reached through ALSA, as desktop Linux
#     reaches PulseAudio/PipeWire), BlackHole on macOS — with the system's
#     FluidSynth. These are virtual machines: the self-test's --virtual reports
#     timing steadiness instead of failing on it; every musical check is strict.
# Read-only, no secrets.
name: Native engine

on:
  push:
    branches: [dev]
    paths: ["native/**", "scripts/build-native.mjs", ".github/workflows/native.yml"]
  pull_request:
    paths: ["native/**", "scripts/build-native.mjs", ".github/workflows/native.yml"]

permissions:
  contents: read

jobs:
  windows:
    name: Windows — build + tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      # the add-on + FluidSynth DLLs the tests load (native/build/); the script
      # needs only Node itself, no npm packages
      - name: Build the native engine
        run: node scripts/build-native.mjs

      # The synth start-up race (fluid.rs) only shows as the first FluidSynth use
      # in a process, so it runs alone, a few times, before the whole suite
      - name: Engine tests
        working-directory: native
        shell: bash
        run: |
          for i in 1 2 3 4 5; do cargo test --release -p orfeo-audio --lib concurrent_first_start; done
          cargo test --release -p orfeo-audio

  compile:
    name: ${{ matrix.os }} — compiles
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # midir/CPAL need ALSA's headers on Linux, rtkit real-time priority needs D-Bus's
      - name: ALSA and D-Bus headers
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev libdbus-1-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Build engine + add-on, compile the tests
        working-directory: native
        run: |
          cargo build --release -p orfeo-audio -p orfeo-audio-node
          cargo test --release -p orfeo-audio --no-run

  plays:
    name: ${{ matrix.os }} — plays (virtual sound card)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Virtual sound card + FluidSynth (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libasound2-dev libdbus-1-dev libfluidsynth3 alsa-utils pulseaudio pulseaudio-utils libasound2-plugins
          # ALSA's default device → PulseAudio → a null sink that plays in real time
          echo 'pcm.!default { type pulse }' | sudo tee /etc/asound.conf
          echo 'ctl.!default { type pulse }' | sudo tee -a /etc/asound.conf
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=virtual
          pactl set-default-sink virtual
          # a null sink that suspends when idle takes ~2 s to wake at every new stream
          # (seen in the block traces); real sound cards wake at once
          pactl unload-module module-suspend-on-idle || true
          pactl list short modules | grep -c suspend || true
          pactl info | grep -i 'default sink'
          echo "FLUID_DIR=$(dirname "$(ldconfig -p | grep -m1 'libfluidsynth.so.3 ' | awk '{print $NF}')")" >> "$GITHUB_ENV"

      - name: Virtual sound card + FluidSynth (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install fluidsynth
          brew install --cask blackhole-2ch
          sudo killall coreaudiod || true
          sleep 5
          system_profiler SPAudioDataType | head -30
          echo "FLUID_DIR=$(brew --prefix)/lib" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Self-test
        working-directory: native
        run: |
          cargo build --release -p orfeo-audio --bin orfeo-selftest
          ./target/release/orfeo-selftest --virtual --fluid "$FLUID_DIR" --sf2 ../public/GeneralUser-GS.sf2 "../public/Demo/Vivaldi 4 stagioni - Estate.mid"

      # Diagnostic only (never fails the run): each stream's first blocks traced, once
      # through the sound server directly (the shipped route) and once through ALSA's
      # bridge — the timings the sound system really asked for.
      - name: Block trace, sound server directly (diagnostic)
        if: always() && runner.os == 'Linux'
        continue-on-error: true
        working-directory: native
        env:
          ORFEO_AUDIO_TRACE: "1"
        run: timeout 120 ./target/release/orfeo-selftest --virtual --fluid "$FLUID_DIR" --sf2 ../public/GeneralUser-GS.sf2 "../public/Demo/Vivaldi 4 stagioni - Estate.mid" 2>&1 | grep -E "trace|pace|Device" | head -150

      - name: Block trace, through ALSA (diagnostic)
        if: always() && runner.os == 'Linux'
        continue-on-error: true
        working-directory: native
        env:
          ORFEO_AUDIO_HOST: alsa
          ORFEO_AUDIO_TRACE: "1"
        run: timeout 120 ./target/release/orfeo-selftest --virtual --fluid "$FLUID_DIR" --sf2 ../public/GeneralUser-GS.sf2 "../public/Demo/Vivaldi 4 stagioni - Estate.mid" 2>&1 | grep -E "trace|pace|Device" | head -150
