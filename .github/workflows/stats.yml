name: Stats

# Once a day at 07:00 Ljubljana time: record release downloads and repository
# traffic on the `stats` branch and rebuild traffic.md. Nothing to click; "Run
# workflow" on the Actions tab runs it on demand. Does not touch main, dev or
# releases.
#
# The daily start comes from outside: a Cloudflare Worker (Cloudflare's cron
# triggers are punctual) starts this workflow at 07:00 Ljubljana with
# daily = true. GitHub's own schedules below stay as a back-up only: on a quiet
# repository they start hours late or not at all. The "Time to collect?" step
# lets through the first daily start at or after 07:00 Ljubljana each day,
# whichever of the two it comes from.

on:
  schedule:
    - cron: '50 4 * * *'
    - cron: '5,25,45 5 * * *'
    - cron: '5,25,45 6 * * *'
    - cron: '5,35 7 * * *'
    - cron: '5 9,12,16 * * *'   # late fall-backs, in case GitHub skipped the morning
  workflow_dispatch:
    inputs:
      daily:
        description: "Count this as the daily 07:00 update (the Cloudflare timer sends this; leave off for a manual run)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Open the stats branch
        run: |
          if git ls-remote --exit-code --heads origin stats >/dev/null; then
            git fetch --depth=1 origin stats
            git worktree add -B stats stats-data origin/stats
          else
            git worktree add --orphan -b stats stats-data
          fi

      - name: Time to collect? (once a day, from 07:00 Ljubljana)
        id: gate
        run: |
          today=$(TZ=Europe/Ljubljana date +%F)
          hhmm=$(TZ=Europe/Ljubljana date +%H%M)
          if [ "${{ github.event_name }}" != "schedule" ] && [ "${{ inputs.daily }}" != "true" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$hhmm" -lt 0700 ]; then
            echo "It's $hhmm in Ljubljana: too early, waiting for 07:00."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git -C stats-data log -20 --format=%s 2>/dev/null | grep -qx "stats: $today (daily)"; then
            echo "Today's daily update is already done."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - name: Collect
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 tools/stats/collect.py --out stats-data

      - name: Save
        if: always() && steps.gate.outputs.go == 'true'
        working-directory: stats-data
        run: |
          [ -f traffic.md ] || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          kind=${{ (github.event_name == 'schedule' || inputs.daily) && 'daily' || 'manual' }}
          git diff --cached --quiet || git commit -m "stats: $(TZ=Europe/Ljubljana date +%F) ($kind)"
          git push origin stats
