# Publishes one Orfeo version as a GitHub release.
#
# Start it by hand: GitHub → Actions → Release → Run workflow (branch: main),
# type the version, e.g. 1.5.0. The tag v1.5.0 must already be on GitHub and
# docs/CHANGELOG.md on main must have a [1.5.0] section. Step-by-step guide:
# docs/CONTRIBUTING.md → "Releasing a new version".
#
# 1. Check   — version, tag, package.json and changelog all agree; builds the notes
# 2. Build   — on Windows, from the tag: installer, portable, latest.yml → draft release,
#              code-signed by SignPath on the way (see the build job);
#              the Microsoft Store package (.appx) is kept as a run artifact, not on GitHub
#              On macOS, at the same time: .dmg and .zip for Apple Silicon and Intel →
#              the same draft (ad-hoc signed, not notarized: no Apple account needed)
#              On Linux, at the same time: AppImage, .deb, .rpm (x64), after a check that
#              the packaged app opens (linux.yml) → the same draft
# 3. Publish — adds the notes and publishes (or keeps it a draft / marks it a pre-release).
#              Windows goes first: it needs only the Windows build. macOS and Linux get up
#              to 30 minutes to join; after that, or if they fail, the release goes out
#              without them and their files join it when they finish (Re-run failed jobs).
#
# The Microsoft Store is a separate step afterwards: Actions → Microsoft Store
# (store.yml) with the same version sends this run's .appx to the Store.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.5.0 (no v). Its tag must already be on GitHub."
        required: true
        type: string
      prerelease:
        description: "Pre-release: shown on GitHub, but installed copies won't update to it"
        type: boolean
        default: false
      draft:
        description: "Test run: build everything but keep the release as a draft"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: 1. Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Get the release tools and changelog (from the branch you picked)
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check the version, tag and package.json
        id: version
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$VERSION' is not a version like 1.5.0 or 1.5.0-beta.1."
            exit 1
          fi
          TAG="v$VERSION"

          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag $TAG is not on GitHub yet. Run /release to tag the release and push the tag, then run this again."
            exit 1
          fi

          # Every release (draft or not) already made for this tag. There can be
          # more than one draft left over from an earlier run.
          EXISTING=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\"")
          if echo "$EXISTING" | grep -q ' false$'; then
            echo "::error::Release $TAG is already published. To redo it, delete it on the Releases page first (keep the tag)."
            exit 1
          fi
          for id in $(echo "$EXISTING" | awk 'NF {print $1}'); do
            echo "Deleting draft release $id for $TAG, left over from an earlier run."
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done

          git fetch --depth 1 origin "refs/tags/$TAG:refs/tags/$TAG"
          TAGGED=$(git show "$TAG:package.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).version))")
          if [ "$TAGGED" != "$VERSION" ]; then
            echo "::error::package.json at $TAG says $TAGGED, not $VERSION. The tag is on the wrong commit."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_ENV"

      - name: Build the release notes from docs/CHANGELOG.md
        run: node scripts/release-notes.mjs "$version" --out release-notes.md

      - name: Show the notes on the run's summary page
        run: cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

      # Made here, once, so the build uploads every file into this one draft.
      # Without it, the installer and blockmap uploads start together, each
      # finds no release, and each creates its own.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v$version" --repo "$GITHUB_REPOSITORY"
          --draft --verify-tag --title "Orfeo $version" --notes-file release-notes.md

  build:
    name: 2. Build (Windows)
    needs: check
    runs-on: windows-latest
    # signing can wait up to an hour per round for an approval in SignPath
    timeout-minutes: 180
    permissions:
      contents: write
      actions: read
    steps:
      - name: Get the code of the tagged version
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # The Native sound engine: Rust add-on + the pinned FluidSynth DLLs
      # (scripts/build-native.mjs). Rust and MSVC come with the Windows runner;
      # the cache keeps the Rust build to a couple of minutes.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Build the native audio engine
        run: npm run native:build

      # Windows code signing, by SignPath (free for open source, SignPath Foundation).
      # Two rounds, because the installer packs the program files inside it:
      #   1. the program files built from this repository (.signpath/app-files.xml)
      #   2. the installer and portable app made from those (.signpath/installers.xml)
      # Each round: upload the files as a run artifact → SignPath signs them → the signed
      # copies come back. The signing policy is the repository variable
      # SIGNPATH_SIGNING_POLICY: test-signing (self-signed test certificate) until the
      # real certificate is in SignPath, then release-signing. The API token of the
      # SignPath CI user is the secret SIGNPATH_API_TOKEN.
      - name: Build the app folder
        shell: bash
        run: |
          npm run build
          npx electron-builder --win --dir --publish never

      - name: Collect the program files to sign
        shell: bash
        run: |
          set -euo pipefail
          mkdir sign-app
          cp release/win-unpacked/Orfeo.exe \
             release/win-unpacked/resources/native/orfeo_audio.node \
             release/win-unpacked/resources/native/orfeo-review.exe sign-app/

      - name: Upload the program files for signing
        id: upload-app
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-app-files
          path: sign-app/*
          if-no-files-found: error

      - name: Sign the program files (SignPath)
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 28762cda-eb5e-44b5-b89a-3d6d4bd3f654
          project-slug: Orfeo
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'test-signing' }}
          artifact-configuration-slug: app-files
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion: true
          # release-signing waits for a person to approve the request in SignPath
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-app

      - name: Put the signed program files back into the app folder
        shell: bash
        run: |
          set -euo pipefail
          cp signed-app/Orfeo.exe release/win-unpacked/
          cp signed-app/orfeo_audio.node signed-app/orfeo-review.exe release/win-unpacked/resources/native/

      - name: Build the installer and portable app from the signed app folder
        shell: bash
        run: |
          npx electron-builder --win nsis portable --prepackaged release/win-unpacked --publish never \
            '-c.nsis.artifactName=Orfeo-Setup-${version}.${ext}' \
            '-c.portable.artifactName=Orfeo-${version}-portable.${ext}'

      - name: Collect the installer and portable app to sign
        shell: bash
        run: |
          set -euo pipefail
          v=$(node -p "require('./package.json').version")
          mkdir sign-installers
          cp "release/Orfeo-Setup-$v.exe" sign-installers/Orfeo-Setup.exe
          cp "release/Orfeo-$v-portable.exe" sign-installers/Orfeo-portable.exe

      - name: Upload the installer and portable app for signing
        id: upload-installers
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installers
          path: sign-installers/*
          if-no-files-found: error

      - name: Sign the installer and portable app (SignPath)
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 28762cda-eb5e-44b5-b89a-3d6d4bd3f654
          project-slug: Orfeo
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'test-signing' }}
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.upload-installers.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installers

      # Signing changes the installer's bytes, so the checksum and blockmap
      # electron-builder made are rebuilt from the signed file
      # (scripts/signed-update-info.mjs); otherwise installed copies would refuse
      # the update.
      - name: Put the signed files back and rebuild latest.yml
        shell: bash
        run: |
          set -euo pipefail
          v=$(node -p "require('./package.json').version")
          cp signed-installers/Orfeo-Setup.exe "release/Orfeo-Setup-$v.exe"
          cp signed-installers/Orfeo-portable.exe "release/Orfeo-$v-portable.exe"
          node scripts/signed-update-info.mjs "release/Orfeo-Setup-$v.exe"

      # Fails the release if any file came back unsigned. A test-certificate
      # signature isn't trusted by Windows, so this checks there is one, not that
      # Windows trusts it.
      - name: Check the signatures
        shell: pwsh
        run: |
          $v = node -p "require('./package.json').version"
          $files = @(
            "release/win-unpacked/Orfeo.exe",
            "release/win-unpacked/resources/native/orfeo_audio.node",
            "release/win-unpacked/resources/native/orfeo-review.exe",
            "release/Orfeo-Setup-$v.exe",
            "release/Orfeo-$v-portable.exe"
          )
          $bad = 0
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f
            "{0}: {1} — {2}" -f $f, $sig.Status, $sig.SignerCertificate.Subject
            if ($null -eq $sig.SignerCertificate) { $bad++ }
          }
          if ($bad) { Write-Error "$bad file(s) are not signed"; exit 1 }

      - name: Upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v=$(node -p "require('./package.json').version")
          cd release
          gh release upload "v$v" "Orfeo-Setup-$v.exe" "Orfeo-Setup-$v.exe.blockmap" \
            "Orfeo-$v-portable.exe" latest.yml --clobber --repo "$GITHUB_REPOSITORY"

      # Installed copies download their update from their own copy of the
      # installer, so GitHub counts in-app updates apart from people
      # downloading Orfeo-Setup (the stats page, tools/stats/collect.py). The
      # same file with the same checksum; only latest.yml points at the copy.
      # Its blockmap goes with it, so the next update can still download only
      # what changed.
      - name: Give installed copies their own update file
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v=$(node -p "require('./package.json').version")
          cd release
          cp "Orfeo-Setup-$v.exe" "Orfeo-Update-$v.exe"
          cp "Orfeo-Setup-$v.exe.blockmap" "Orfeo-Update-$v.exe.blockmap"
          sed -i "s/Orfeo-Setup-$v\.exe/Orfeo-Update-$v.exe/g" latest.yml
          cat latest.yml
          if grep -q "Orfeo-Setup-" latest.yml || ! grep -q "Orfeo-Update-$v.exe" latest.yml; then
            echo "::error::latest.yml doesn't point at Orfeo-Update-$v.exe"; exit 1
          fi
          # --clobber replaces the latest.yml uploaded above (still a draft: nobody sees the change)
          gh release upload "v$v" "Orfeo-Update-$v.exe" "Orfeo-Update-$v.exe.blockmap" latest.yml --clobber --repo "$GITHUB_REPOSITORY"

      # The Store package is unsigned here — the Store signs it — so it is no
      # use on the GitHub release page; the Microsoft Store workflow (store.yml) picks it up. Built
      # from the app folder step above already made, so it's the same app.
      # A pre-release version (1.5.0-beta.1) can't be a Store version at all.
      - name: Build the Microsoft Store package
        if: ${{ !inputs.prerelease }}
        shell: bash
        run: npx electron-builder --win appx --prepackaged release/win-unpacked --publish never

      - uses: actions/upload-artifact@v7
        if: ${{ !inputs.prerelease }}
        with:
          name: store-package
          path: release/*.appx
          if-no-files-found: error

  build-mac:
    name: 2. Build (macOS)
    needs: check
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Get the code of the tagged version
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Both architectures from the one Apple Silicon runner: nothing native to
      # compile — the Native engine is Windows-only. The codesign check catches
      # an app macOS would call damaged.
      - name: Build and upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          npm run dist:mac -- --publish never
          for app in release/mac/Orfeo.app release/mac-arm64/Orfeo.app; do
            codesign --verify --deep --strict "$app"
          done
          # --clobber: re-running a failed job replaces what it uploaded before
          gh release upload "$TAG" release/*.dmg release/*.zip --clobber --repo "$GITHUB_REPOSITORY"

  # Linux, alongside Windows and from the same tag: AppImage, .deb and .rpm,
  # plus a check that the packaged app opens (linux.yml, also runnable by hand).
  build-linux:
    name: 2. Build (Linux)
    needs: check
    uses: ./.github/workflows/linux.yml
    with:
      ref: ${{ needs.check.outputs.tag }}

  # Into the same draft. --clobber: re-running a failed job replaces what it uploaded.
  upload-linux:
    name: 2. Upload (Linux)
    needs: [check, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-packages
          path: linux

      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        # release/: the artifact also holds the start-up check's files, so it keeps its folders
        run: gh release upload "$TAG" linux/release/*.AppImage linux/release/*.deb linux/release/*.rpm --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    name: 3. Publish
    # Windows only: a macOS or Linux build must never hold a Windows release back. They
    # aren't in `needs` because a job waiting for a machine would hold this one back too
    # (GitHub can run out of macOS machines); the step below waits for them, for a while.
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-notes

      # Normally both are done within minutes and the release goes out complete
      - name: Give macOS and Linux up to 30 minutes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 90); do
            finished=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100"               --jq '[.jobs[] | select(.name == "2. Build (macOS)" or .name == "2. Upload (Linux)") | select(.status == "completed")] | length')
            [ "$finished" = "2" ] && break
            sleep 20
          done

      - name: Add the notes and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          common=(--repo "$GITHUB_REPOSITORY" --title "Orfeo ${TAG#v}" --notes-file release-notes.md)
          if [ "$DRAFT" = "true" ]; then
            gh release edit "$TAG" "${common[@]}" --draft=true
            echo "### Kept as a draft" >> "$GITHUB_STEP_SUMMARY"
            echo "Check it on the Releases page, then publish it there by hand, or delete it and run again." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PRERELEASE" = "true" ]; then
            gh release edit "$TAG" "${common[@]}" --draft=false --prerelease
            echo "### Published $TAG as a pre-release" >> "$GITHUB_STEP_SUMMARY"
          else
            gh release edit "$TAG" "${common[@]}" --draft=false --prerelease=false --latest
            echo "### Published $TAG" >> "$GITHUB_STEP_SUMMARY"
            echo "Installed copies of Orfeo will offer the update the next time they start." >> "$GITHUB_STEP_SUMMARY"
            echo "Next, the Microsoft Store: Actions → **Microsoft Store** → Run workflow, version **${TAG#v}**." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
          # say plainly what isn't there yet
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for platform in "macOS:.dmg" "Linux:.AppImage"; do
            if ! grep -qF "${platform#*:}" <<< "$assets"; then
              echo "::warning::${platform%%:*} files aren't on this release yet."
              echo "**${platform%%:*} files aren't on this release yet.** They join it by themselves if the job is still running; if it failed or was cancelled, use *Re-run failed jobs* on this run." >> "$GITHUB_STEP_SUMMARY"
            fi
          done
