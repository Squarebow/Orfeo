# Checks every pull request still type-checks and packages for macOS (both
# architectures, unsigned). No secrets: fork pull requests run it as well.
# Releases build macOS in release.yml.
name: macOS build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Package (unsigned)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Package
        run: npm run dist:mac -- --publish never

      - name: Check the app signatures
        run: |
          for app in release/mac/Orfeo.app release/mac-arm64/Orfeo.app; do
            codesign --verify --deep --strict "$app"
          done
