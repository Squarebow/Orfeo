# Checks that every push to dev and every pull request still type-checks and
# packages for macOS (both architectures, ad-hoc signed, as releases are), so a
# change that breaks the Mac build shows up straight away, not on release day.
# Read-only and no secrets, so fork pull requests run it as well. Releases build
# macOS in release.yml.
name: macOS build

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  build:
    name: Package
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Package
        env:
          CSC_FOR_PULL_REQUEST: 'true'
        run: npm run dist:mac -- --publish never

      - name: Check the app signatures
        run: |
          for app in release/mac/Orfeo.app release/mac-arm64/Orfeo.app; do
            codesign --verify --deep --strict "$app"
          done
